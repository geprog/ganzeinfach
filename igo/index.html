<style>
  :root{
    --bg:#F4EFE3;
    --surface:#FFFFFF;
    --surface-2:#F8F3E8;
    --ink:#2B2416;
    --muted:#6E6350;
    --line:#E3D8C2;
    --accent:#4A6534;
    --accent-soft:#E3ECDA;
    --warn-soft:#F6DDD3;
    --note-soft:#EFE6D3;
    --btn-bg:#2B2416;
    --btn-fg:#FFFFFF;
    --shadow:0 1px 2px rgba(43,36,22,.06), 0 14px 40px rgba(43,36,22,.10);
    --radius:26px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1B1811;
      --surface:#242017;
      --surface-2:#2A251A;
      --ink:#F0E9DC;
      --muted:#C9BEA8;
      --line:#3A3326;
      --accent:#8FB96B;
      --accent-soft:#33422A;
      --warn-soft:#4A2A22;
      --note-soft:#332C1C;
      --btn-bg:#8FB96B;
      --btn-fg:#1B1811;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:18px;line-height:1.55;color:var(--ink);background:var(--bg);
  }
  .wrap{max-width:780px;margin:0 auto;padding:22px 18px 56px}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
  .hgroup{display:flex;align-items:center;gap:10px}
  .hlink{font-weight:700;color:var(--muted);text-underline-offset:3px}
  .tag{font-size:.8rem;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 12px}

  /* Bühne */
  .stage{display:flex;align-items:flex-end;gap:16px;margin:18px 0}
  .igo-wrap{flex:0 0 132px}
  .igo{width:132px;height:auto;display:block;overflow:visible}
  .igo-wrap.hop{animation:hop .5s ease-out 2}
  .bubble{
    position:relative;flex:1;background:var(--surface);border:1px solid var(--line);
    border-radius:22px;padding:16px 20px;font-weight:600;margin-bottom:30px;box-shadow:var(--shadow);
  }
  .bubble::before{
    content:"";position:absolute;left:-9px;bottom:24px;width:16px;height:16px;background:var(--surface);
    border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);
  }
  .bubble.pop{animation:pop .3s ease-out}

  .body-g{animation:bob 3.6s ease-in-out infinite}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
  .arm{transform-box:fill-box;transform-origin:center;transition:transform .3s ease}
  .arm-l{transform:rotate(-14deg)}
  .arm-r{transform:rotate(14deg)}
  [data-mood="happy"] .arm-l{transform:rotate(-26deg)}
  [data-mood="happy"] .arm-r{transform:rotate(26deg)}
  .mouth{display:none}
  [data-mood="calm"] .m-calm{display:inline}
  [data-mood="happy"] .m-happy{display:inline}
  [data-mood="wave"] .m-calm{display:inline}

  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  @keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-18px)}}
  @keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:scale(1);opacity:1}}

  /* Karte */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px 28px 24px;box-shadow:var(--shadow)}
  .card.swap{animation:pop .25s ease-out}
  h2{font-size:1.5rem;line-height:1.2;margin:0 0 12px;letter-spacing:-.01em}
  p{margin:0 0 12px;max-width:62ch}
  a{color:var(--accent);font-weight:700;text-underline-offset:3px}
  strong{font-weight:800}

  .note,.tip,.warn{border-radius:16px;padding:12px 16px;margin:14px 0;font-size:.96rem;max-width:62ch}
  .note{background:var(--note-soft)}
  .tip{background:var(--accent-soft)}
  .warn{background:var(--warn-soft)}
  .tip strong:first-child,.note strong:first-child,.warn strong:first-child{display:block;margin-bottom:2px}

  /* Auswahl-Karten */
  .choices{display:grid;gap:10px;margin:14px 0 6px}
  .choice{
    text-align:left;font:inherit;color:inherit;cursor:pointer;
    background:var(--surface-2);border:2px solid var(--line);border-radius:18px;padding:14px 16px;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice strong{display:block}
  .choice span{font-size:.94rem;color:var(--muted)}
  .choice:hover{border-color:var(--accent)}
  .choice[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}

  /* Buttons */
  .btn{
    font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:999px;padding:12px 26px;
    background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--btn-bg);color:var(--btn-fg);box-shadow:none}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}
  .actions .spacer{flex:1}
  .textbtn{font:inherit;font-weight:700;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}

  .prompt{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;margin:0 0 14px}
  .prompt pre{margin:0 0 10px;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:.92rem;line-height:1.5;max-height:260px;overflow:auto}

  .done-check{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--accent)}
  .done-check svg{width:22px;height:22px;flex:none}

  footer{margin-top:26px;text-align:center;font-size:.88rem;color:var(--muted)}
  .flinks{margin-top:10px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
  .flinks a{color:var(--muted);font-weight:600}

  :focus-visible{outline:3px solid var(--accent);outline-offset:3px}

  @media (max-width:560px){
    body{font-size:17px}
    .stage{flex-direction:column-reverse;align-items:center;gap:8px}
    .igo-wrap{flex-basis:auto}
    .igo{width:110px}
    .bubble{margin-bottom:0;width:100%}
    .bubble::before{left:50%;margin-left:-8px;bottom:-9px;border-left:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
    .card{padding:22px 18px 18px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hgroup"><div class="brand">Igo</div><span class="tag">Akquise, ganz sanft</span></div>
    <a class="hlink" href="../">Alle Werkzeuge</a>

  <section class="stage" aria-live="polite">
    <div class="igo-wrap" id="igoWrap">
      <svg class="igo" id="igo" data-mood="wave" viewBox="0 0 168 196" role="img" aria-label="Igo, ein kleiner freundlicher Igel">
        <ellipse cx="84" cy="192" rx="44" ry="7" fill="#16213A" opacity=".15"/>
        <g class="body-g">
          <!-- Füße -->
          <ellipse cx="64" cy="187" rx="15" ry="10" fill="#B9793E"/>
          <ellipse cx="104" cy="187" rx="15" ry="10" fill="#B9793E"/>
          <!-- Stachelkranz + Körper -->
          <path fill="#B9793E" d="M118.0 180.9 L115.9 182.0 L113.8 183.1 L111.7 184.1 L109.5 185.0 L107.3 185.9 L105.0 186.7 L102.7 187.4 L100.5 188.0 L98.1 188.5 L95.8 189.0 L93.5 189.3 L91.1 189.6 L88.7 189.8 L86.4 190.0 L84.0 190.0 L81.6 190.0 L79.3 189.8 L76.9 189.6 L74.5 189.3 L72.2 189.0 L69.9 188.5 L67.5 188.0 L65.3 187.4 L63.0 186.7 L60.7 185.9 L58.5 185.0 L56.3 184.1 L54.2 183.1 L52.1 182.0 L50.0 180.9 L27.4 181.3 L30.2 156.6 L6.5 148.8 L20.3 128.1 L2.8 110.3 L24.6 98.2 L17.2 74.4 L42.1 73.6 L46.4 49.1 L68.9 59.8 L84.0 22.0 L99.1 59.8 L121.6 49.1 L125.9 73.6 L150.8 74.4 L143.4 98.2 L165.2 110.3 L147.7 128.1 L161.5 148.8 L137.8 156.6 L140.6 181.3 L118.0 180.9 Z"/>
          <!-- Gesicht & Bauch -->
          <ellipse cx="84" cy="130" rx="56" ry="60" fill="#F2E3C8"/>
          <ellipse cx="84" cy="160" rx="30" ry="20" fill="#FFFFFF" opacity=".12"/>
          <!-- Wangen -->
          <circle cx="44" cy="128" r="10" fill="#FF8A7A" opacity=".55"/>
          <circle cx="124" cy="128" r="10" fill="#FF8A7A" opacity=".55"/>
          <!-- Augen -->
          <circle class="eye" cx="62" cy="110" r="12" fill="#2B2416"/>
          <circle class="eye" cx="106" cy="110" r="12" fill="#2B2416"/>
          <circle cx="58" cy="106" r="3.4" fill="#FFFFFF"/>
          <circle cx="102" cy="106" r="3.4" fill="#FFFFFF"/>

          <path class="mouth m-happy" d="M68 142 Q84 160 100 142" fill="none" stroke="#2B2416" stroke-width="3" stroke-linecap="round"/>
          <!-- Arme (unten am Bauch, weit weg vom Gesicht) -->
          <g class="arm arm-l"><ellipse cx="60" cy="176" rx="19" ry="15" fill="#B9793E"/></g>
          <g class="arm arm-r"><ellipse cx="108" cy="176" rx="19" ry="15" fill="#B9793E"/></g>
        </g>
      </svg>
    </div>
    <div class="bubble" id="bubble"></div>
  </section>

  <main class="card" id="card"></main>

  <footer>
    Deine Angaben und dein Fortschritt bleiben in diesem Browser gespeichert und sind bei deinem nächsten Besuch wieder da. Sie verlassen dieses Gerät nie. Bitte keine echten Kundennamen eingeben.
    <button class="textbtn no-print" id="reset" type="button">Von vorn beginnen</button>
    <div class="flinks no-print"><a href="https://geprog.com/imprint">Impressum</a> <a href="https://geprog.com/privacy">Datenschutz</a> <a href="https://geprog.com/">GEPROG GmbH</a></div>
  </footer>

<script>
(function(){
  "use strict";

  var KEY = "igo-v1";

  /* ---------- Speicher ---------- */
  function load(){
    try{
      var raw = window.localStorage.getItem(KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }
  function save(){
    try{ window.localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
  }

  var data = load() || { profile:null, step:0, draft:{}, seenDates:[], doneDates:[], hideEncouragement:false };

  function todayStr(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function hashStr(s){
    var h = 0;
    for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }

  /* ---------- Fragen für das kurze Profil ---------- */
  var QUESTIONS = [
    {
      key:"business",
      say:"Womit verdienst du dein Geld hauptsächlich?",
      title:"Dein Geschäft",
      options:[
        {v:"projekt", t:"Projektgeschäft", s:"Feste Aufträge, meist über längere Zeit."},
        {v:"vertrieb", t:"Laufender Vertrieb", s:"Du verkaufst regelmäßig neu, immer wieder."},
        {v:"mischung", t:"Beides", s:"Mal Projekte, mal laufender Vertrieb."}
      ]
    },
    {
      key:"leads",
      say:"Hast du schon Leute, an die du dich wenden könntest?",
      title:"Leads",
      options:[
        {v:"ja", t:"Ja, ich habe Kontakte", s:"Ehemalige Kunden, Anfragen, Netzwerk."},
        {v:"nein", t:"Eher nicht", s:"Ich müsste bei null anfangen."}
      ]
    },
    {
      key:"channel",
      say:"Was ist dir am angenehmsten?",
      title:"Dein Kanal",
      options:[
        {v:"telefon", t:"Telefonieren", s:"Direkt am Telefon sprechen."},
        {v:"netzwerk", t:"Netzwerken & Events", s:"Auf Menschen treffen, live oder online."},
        {v:"schreiben", t:"Schreiben", s:"E-Mail, LinkedIn, Nachrichten."},
        {v:"unsicher", t:"Bin mir nicht sicher", s:"Zeig mir einfach etwas Passendes."}
      ]
    },
    {
      key:"time",
      say:"Wie viel Zeit hast du realistisch pro Tag dafür?",
      title:"Deine Zeit",
      options:[
        {v:"5", t:"5 Minuten", s:"Ganz kurz reicht mir."},
        {v:"15", t:"15 Minuten", s:"Etwas mehr geht."},
        {v:"mehr", t:"Mehr, wenn nötig", s:"Ich kann mir auch mal Zeit nehmen."}
      ]
    },
    {
      key:"habit",
      say:"Wie machst du Akquise bisher?",
      title:"Bisher",
      options:[
        {v:"nie", t:"Gar nicht", s:"Ich schiebe es eigentlich immer auf."},
        {v:"selten", t:"Sporadisch", s:"Mal, wenn gerade Zeit ist."},
        {v:"ungern", t:"Regelmäßig, aber ungern", s:"Ich mache es, mag es aber nicht."},
        {v:"gern", t:"Regelmäßig, passt schon", s:"Ich will nur noch etwas mehr tun."}
      ]
    }
  ];

  function timeBudget(v){ return v === "5" ? 5 : v === "15" ? 15 : 30; }

  /* ---------- Aufgaben-Bank ---------- */
  // channels: ["alle"] oder Teilmenge von telefon/netzwerk/schreiben
  // business: ["alle"] oder Teilmenge von projekt/vertrieb
  // needsLeads: null (egal), true, false
  var TASKS = [
    {channels:["telefon"], business:["alle"], needsLeads:true, minTime:5,
      text:"Ruf heute eine einzige Person aus deiner Liste an. Frag nur, wie es ihr gerade geht – kein Verkaufsgespräch nötig."},
    {channels:["telefon"], business:["alle"], needsLeads:false, minTime:15,
      text:"Ruf eine Person an, mit der du länger nicht gesprochen hast, und frag einfach, was bei ihr gerade ansteht."},
    {channels:["telefon"], business:["vertrieb"], needsLeads:null, minTime:15,
      text:"Wähle eine Nummer aus deiner Liste und stell dich kurz vor. Mehr nicht – der erste Kontakt zählt."},
    {channels:["netzwerk"], business:["alle"], needsLeads:null, minTime:5,
      text:"Schau dir eine Netzwerkveranstaltung oder Gruppe in deiner Nähe oder online an, ohne dich anzumelden."},
    {channels:["netzwerk"], business:["alle"], needsLeads:null, minTime:15,
      text:"Melde dich für eine Netzwerkveranstaltung oder ein Branchentreffen an, egal ob online oder vor Ort."},
    {channels:["netzwerk"], business:["alle"], needsLeads:true, minTime:5,
      text:"Schreib einer Kontaktperson von der letzten Veranstaltung eine kurze Nachricht – nur ein freundliches Hallo."},
    {channels:["schreiben"], business:["alle"], needsLeads:true, minTime:5,
      text:"Schreib einer ehemaligen Kundin oder einem ehemaligen Kunden eine kurze Nachricht und frag, wie es läuft."},
    {channels:["schreiben"], business:["alle"], needsLeads:false, minTime:5,
      text:"Schreib eine kurze Nachricht an eine Person, die zu deiner Zielgruppe passt – einfach, um dich vorzustellen."},
    {channels:["schreiben"], business:["projekt"], needsLeads:null, minTime:15,
      text:"Schreib eine kurze Nachfrage an einen laufenden oder abgeschlossenen Auftrag: ob es weiteren Bedarf gibt."},
    {channels:["schreiben"], business:["vertrieb"], needsLeads:null, minTime:5,
      text:"Schreib einem offenen Kontakt aus deiner Liste eine kurze, freundliche Nachricht."},
    {channels:["alle"], business:["projekt"], needsLeads:true, minTime:5,
      text:"Frag bei einem bestehenden Kunden nach, ob es ein weiteres Thema gibt, bei dem du helfen kannst."},
    {channels:["alle"], business:["projekt"], needsLeads:null, minTime:5,
      text:"Frag eine zufriedene Kundin oder einen zufriedenen Kunden, ob sie oder er dich weiterempfehlen würde."},
    {channels:["alle"], business:["alle"], needsLeads:null, minTime:5,
      text:"Trag eine einzige neue Idee für eine mögliche Kundin oder einen möglichen Kunden in eine Liste ein."},
    {channels:["alle"], business:["alle"], needsLeads:null, minTime:5,
      text:"Aktualisiere kurz deine Kontaktliste: eine veraltete Angabe korrigieren oder einen neuen Kontakt ergänzen."},
    {channels:["alle"], business:["alle"], needsLeads:null, minTime:5,
      text:"Lies dir deine letzte Selbstbeschreibung (z. B. auf LinkedIn oder deiner Website) durch und verbessere einen Satz."},
    {channels:["alle"], business:["alle"], needsLeads:null, minTime:15,
      text:"Überleg dir eine Person, die du schon lange mal wieder ansprechen wolltest, und plane, wie du es diese Woche tust."},
    {channels:["alle"], business:["alle"], needsLeads:null, minTime:5,
      text:"Notiere dir drei Dinge, die deine Kundinnen und Kunden an dir schätzen – für den nächsten ersten Kontakt."}
  ];

  function matchTask(t, p){
    var channelOk = t.channels.indexOf("alle") > -1 || t.channels.indexOf(p.channel) > -1 || p.channel === "unsicher";
    var businessOk = t.business.indexOf("alle") > -1 || t.business.indexOf(p.business) > -1 || p.business === "mischung";
    var leadsOk = t.needsLeads === null || t.needsLeads === (p.leads === "ja");
    var timeOk = t.minTime <= timeBudget(p.time);
    return channelOk && businessOk && leadsOk && timeOk;
  }

  function pickTask(dateStr, p){
    var pool = TASKS.filter(function(t){ return matchTask(t, p); });
    if(!pool.length) pool = TASKS.filter(function(t){ return t.minTime <= 5; });
    var idx = hashStr(dateStr + "|task") % pool.length;
    return pool[idx].text;
  }

  /* ---------- KI-Impulse (selten, etwa alle 4 Tage) ---------- */
  var IMPULSES = [
    {
      title:"Wieder anstoßen",
      intro:"Heute mal kein Alleingang: lass dir von deiner KI eine kurze Nachricht formulieren.",
      prompt:function(p){
        return "Formuliere mir eine kurze, freundliche Nachricht (max. 4 Sätze) an eine frühere Kundin oder einen früheren Kunden. Ziel: unverbindlich nachfragen, ob aktuell Bedarf besteht. Ton: locker, nicht verkäuferisch. Mein Angebot in Stichworten: [hier kurz ergänzen].";
      }
    },
    {
      title:"Kurz vorstellen",
      intro:"Ein guter kurzer Satz über dich hilft bei jedem ersten Kontakt. Lass ihn dir vorschlagen.",
      prompt:function(p){
        return "Formuliere mir drei verschiedene Varianten eines kurzen Satzes (je max. 2 Sätze), mit dem ich mich und mein Angebot einer fremden Person vorstellen kann. Mein Angebot in Stichworten: [hier kurz ergänzen]. Zielgruppe: [hier kurz ergänzen].";
      }
    },
    {
      title:"Beitrag fürs Netzwerk",
      intro:"Ein kurzer Beitrag hält dich sichtbar, ohne dass du aktiv jemanden ansprechen musst.",
      prompt:function(p){
        return "Schreibe mir einen kurzen, persönlichen Beitrag (ca. 80-120 Wörter) für LinkedIn über eine aktuelle Erfahrung aus meiner Arbeit. Thema/Stichwort: [hier kurz ergänzen]. Ton: ehrlich, nicht werblich.";
      }
    },
    {
      title:"Leitfaden fürs Telefon",
      intro:"Ein grober roter Faden nimmt die Angst vor dem ersten Satz am Telefon.",
      prompt:function(p){
        return "Erstelle mir einen kurzen, lockeren Gesprächsleitfaden (Stichpunkte, keine Sätze zum Auswendiglernen) für einen Anruf bei [Zielperson/Zielgruppe hier ergänzen], mit dem Ziel: [Ziel des Anrufs hier ergänzen].";
      }
    },
    {
      title:"Empfehlung anstoßen",
      intro:"Zufriedene Kunden sind oft der leichteste Weg zu neuen – man muss nur fragen.",
      prompt:function(p){
        return "Formuliere mir eine kurze, unaufdringliche Nachricht an eine zufriedene Kundin oder einen zufriedenen Kunden, in der ich frage, ob sie oder er mich weiterempfehlen würde. Ton: dankbar, nicht fordernd.";
      }
    }
  ];

  function pickImpulse(dateStr){
    var idx = hashStr(dateStr + "|impuls") % IMPULSES.length;
    return IMPULSES[idx];
  }

  function isImpulseDay(dayNumber){
    return dayNumber > 0 && dayNumber % 4 === 0;
  }

  /* ---------- Rendern: Bühne ---------- */
  var igoEl, bubbleEl, cardEl;

  function setMood(m){ igoEl.setAttribute("data-mood", m); }
  function setBubble(text){
    bubbleEl.classList.remove("pop");
    bubbleEl.textContent = text;
    void bubbleEl.offsetWidth;
    bubbleEl.classList.add("pop");
  }
  function swapCard(html){
    cardEl.classList.remove("swap");
    cardEl.innerHTML = html;
    void cardEl.offsetWidth;
    cardEl.classList.add("swap");
  }

  /* ---------- Auswahl-Radiogroup (Tastatur: Pfeiltasten, Roving-Tabindex) ---------- */
  function choiceHtml(q, selectedValue){
    var html = "<div class=\"choices\" role=\"radiogroup\" aria-label=\"" + q.title + "\">";
    q.options.forEach(function(o, i){
      var selected = o.v === selectedValue;
      var roving = selectedValue ? selected : i === 0;
      html += "<button type=\"button\" role=\"radio\" class=\"choice\" data-value=\"" + o.v + "\" aria-checked=\"" + selected + "\" tabindex=\"" + (roving ? "0" : "-1") + "\"><strong>" + o.t + "</strong><span>" + o.s + "</span></button>";
    });
    html += "</div>";
    return html;
  }

  document.addEventListener("keydown", function(ev){
    var dir = ev.key === "ArrowDown" || ev.key === "ArrowRight" ? 1
            : ev.key === "ArrowUp" || ev.key === "ArrowLeft" ? -1 : 0;
    if(!dir) return;
    var t = ev.target.closest && ev.target.closest('[role="radio"]');
    var group = t && t.closest('[role="radiogroup"]');
    if(!group) return;
    ev.preventDefault();
    var items = Array.prototype.slice.call(group.querySelectorAll('[role="radio"]'));
    var idx = items.indexOf(t);
    var next = items[(idx + dir + items.length) % items.length];
    var value = next.getAttribute("data-value");
    var q = QUESTIONS[data.step];
    data.draft[q.key] = value;
    save();
    renderQuestion();
    var focusTarget = document.querySelector('[role="radio"][data-value="' + value + '"]');
    if(focusTarget) focusTarget.focus();
  });

  /* ---------- Onboarding ---------- */
  function renderQuestion(){
    var q = QUESTIONS[data.step];
    setMood(data.step === 0 ? "wave" : "calm");
    setBubble(q.say);
    var selected = data.draft[q.key];
    var html = "<h2>" + q.title + "</h2>" + choiceHtml(q, selected);
    html += "<div class=\"actions\">";
    if(data.step > 0) html += "<button type=\"button\" class=\"btn\" data-action=\"back\">Zurück</button>";
    html += "<span class=\"spacer\"></span>";
    html += "<button type=\"button\" class=\"btn primary\" data-action=\"next\" " + (selected ? "" : "disabled") + ">" + (data.step === QUESTIONS.length - 1 ? "Fertig" : "Weiter") + "</button>";
    html += "</div>";
    swapCard(html);
  }

  function bindOnboardingEvents(){
    cardEl.addEventListener("click", function(ev){
      var choice = ev.target.closest('[role="radio"]');
      if(choice){
        var q = QUESTIONS[data.step];
        data.draft[q.key] = choice.getAttribute("data-value");
        save();
        renderQuestion();
        return;
      }
      var action = ev.target.closest("[data-action]");
      if(!action) return;
      var act = action.getAttribute("data-action");
      if(act === "next"){
        if(data.step < QUESTIONS.length - 1){
          data.step += 1;
          save();
          renderQuestion();
        } else {
          data.profile = data.draft;
          data.step = 0;
          save();
          renderDay();
        }
      } else if(act === "back"){
        data.step = Math.max(0, data.step - 1);
        save();
        renderQuestion();
      }
    });
  }

  /* ---------- Tagesansicht ---------- */
  function ensureSeenToday(){
    var t = todayStr();
    if(data.seenDates.indexOf(t) === -1) data.seenDates.push(t);
    return t;
  }
  function last7DoneCount(){
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 7);
    return data.doneDates.filter(function(d){ return new Date(d + "T00:00:00") >= cutoff; }).length;
  }

  function renderDay(){
    var t = ensureSeenToday();
    save();
    var dayNumber = data.seenDates.length;
    var doneToday = data.doneDates.indexOf(t) > -1;
    var html = "";

    if(isImpulseDay(dayNumber)){
      var imp = pickImpulse(t);
      setMood(doneToday ? "happy" : "calm");
      setBubble("Heute mal etwas anderes: " + imp.title + ".");
      html += "<h2>" + imp.title + "</h2><p>" + imp.intro + "</p>";
      html += "<div class=\"prompt\"><pre id=\"promptText\">" + imp.prompt(data.profile) + "</pre>";
      html += "<button type=\"button\" class=\"btn\" data-action=\"copy\">Text kopieren</button></div>";
      html += "<p class=\"tip\"><strong>So geht's weiter</strong>Kopiere den Text in dein KI-Werkzeug (z. B. Claude oder ChatGPT), ergänze die eckigen Klammern und pass das Ergebnis an dich an.</p>";
    } else {
      var task = pickTask(t, data.profile);
      setMood(doneToday ? "happy" : "calm");
      setBubble(doneToday ? "Schön, das hast du heute schon erledigt." : "Hier ist deine kleine Aufgabe für heute.");
      html += "<h2>Heute dran</h2><p>" + task + "</p>";
    }

    html += "<div class=\"actions\">";
    if(doneToday){
      html += "<span class=\"done-check\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M4 12l5 5L20 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>Heute erledigt</span>";
    } else {
      html += "<button type=\"button\" class=\"btn primary\" data-action=\"done\">Erledigt</button>";
    }
    html += "<span class=\"spacer\"></span>";
    html += "<button type=\"button\" class=\"textbtn\" data-action=\"profile\">Profil ändern</button>";
    html += "</div>";

    if(doneToday && !data.hideEncouragement){
      var n = last7DoneCount();
      if(n > 1){
        html += "<p class=\"note\"><strong>Schön</strong>Das war diese Woche schon dein " + n + ". kleiner Schritt. <button type=\"button\" class=\"textbtn\" data-action=\"hideEncourage\">Diesen Hinweis nicht mehr zeigen</button></p>";
      }
    }

    swapCard(html);
  }

  function bindDayEvents(){
    cardEl.addEventListener("click", function(ev){
      var action = ev.target.closest("[data-action]");
      if(!action) return;
      var act = action.getAttribute("data-action");
      if(act === "done"){
        var t = todayStr();
        if(data.doneDates.indexOf(t) === -1) data.doneDates.push(t);
        save();
        renderDay();
      } else if(act === "profile"){
        data.draft = Object.assign({}, data.profile);
        data.step = 0;
        save();
        renderQuestion();
      } else if(act === "hideEncourage"){
        data.hideEncouragement = true;
        save();
        renderDay();
      } else if(act === "copy"){
        copyPrompt(action);
      }
    });
  }

  function copyPrompt(btn){
    var text = document.getElementById("promptText").textContent;
    function ok(){ btn.textContent = "Kopiert!"; setTimeout(function(){ btn.textContent = "Text kopieren"; }, 1800); }
    function fallback(){
      try{
        var range = document.createRange();
        range.selectNodeContents(document.getElementById("promptText"));
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand("copy");
        ok();
      }catch(e){ btn.textContent = "Bitte von Hand markieren"; }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, fallback); }
    else fallback();
  }

  /* ---------- Start ---------- */
  igoEl = document.getElementById("igo");
  bubbleEl = document.getElementById("bubble");
  cardEl = document.getElementById("card");

  bindOnboardingEvents();
  bindDayEvents();

  if(data.profile){
    renderDay();
  } else {
    if(!data.draft) data.draft = {};
    renderQuestion();
  }

  document.getElementById("reset").addEventListener("click", function(){
    if(window.confirm("Wirklich alles löschen und von vorn beginnen?")){
      window.localStorage.removeItem(KEY);
      data = { profile:null, step:0, draft:{}, seenDates:[], doneDates:[], hideEncouragement:false };
      renderQuestion();
    }
  });
})();
</script>
